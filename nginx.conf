# Config nginx du conteneur web (SPA MyBrief).
# Remplace /etc/nginx/conf.d/default.conf de l'image nginx:alpine.
#
# Objectif : empêcher le navigateur de servir un index.html périmé après un
# déploiement. Par défaut nginx n'envoie AUCUN Cache-Control sur le HTML, donc
# le navigateur applique un cache heuristique et peut continuer à charger
# l'ancienne version (qui référence des bundles JS/CSS aux empreintes obsolètes)
# jusqu'à un hard refresh. On force donc la revalidation du HTML et des
# fichiers de contrôle PWA, tout en gardant un cache long sur les assets
# hashés (immuables par construction Vite).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    error_page 404 /404.html;

    # ── Garde-fou "400 Request Header Or Cookie Too Large" ───────────────────
    # Le plugin traefikoidc stocke la session OIDC dans des cookies découpés
    # (_oidc_raczylo_s_0..s_9, ~2,8 Ko encodés chacun -> jusqu'à ~31 Ko).
    # `Cookie` est UNE seule ligne d'en-tête : avec les défauts nginx
    # (large_client_header_buffers 4 8k) elle dépasse 8 Ko dès 3 chunks — tokens
    # Entra ID typiques — et nginx répond 400 avant même de router la requête.
    # 32 Ko couvre les 10 chunks + le reste des en-têtes.
    client_header_buffer_size    8k;
    large_client_header_buffers  8 32k;

    # Filet si ça déborde quand même (chunks orphelins accumulés : le plugin
    # arrête sa purge au premier chunk manquant, cf. expireOldCombinedChunks).
    # 494 = code interne nginx "request header too large", exposé en 400.
    # Au lieu de la page nginx en cul-de-sac, on renvoie vers le logout du
    # plugin, qui expire TOUS les cookies de session côté serveur (les cookies
    # sont HttpOnly : du JS ne peut pas les effacer), puis retour sur `/`.
    error_page 400 494 = @cookie_reset;

    location @cookie_reset {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Reconnexion…</title></head><body style="font-family:system-ui;text-align:center;padding:48px"><p>Session trop volumineuse, remise à zéro en cours…</p><script>location.replace("/oauth2/callback/logout");</script><noscript><a href="/oauth2/callback/logout">Cliquez ici pour continuer</a></noscript></body></html>';
    }

    # Assets générés par Vite : le nom contient l'empreinte du contenu
    # (ex: index-Cu_tVNq_.js). Le contenu ne change jamais pour un nom donné
    # -> cache "immutable" très long. =404 (et non fallback HTML) pour éviter
    # qu'un asset manquant soit servi comme du HTML (erreur de parsing JS).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Téléchargements de l'app mobile (APK + QR déposés par la CI
    # mobile-android.yml), montés en volume par compose (survivent aux
    # rebuilds d'image). Même mécanisme que la page /app de MIA.
    location /downloads/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Page d'installation de l'app mobile (statique, dans le build).
    # `=` : correspondance exacte, ne shadow aucune route SPA.
    location = /app {
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    # Tout le reste (index.html, sw.js, registerSW.js, manifest.webmanifest,
    # icônes, favicon...) : toujours revalider avec le serveur. Combiné à
    # l'ETag/Last-Modified que nginx envoie déjà, une version inchangée renvoie
    # un 304 (léger), une nouvelle version renvoie le nouveau contenu.
    # Fallback SPA vers index.html pour toute route inconnue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
