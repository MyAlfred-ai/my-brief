<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MyBrief</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Site lié : les deux boutons, les liens, l'état -->
    <section id="linked" hidden>
      <header class="head">
        <img id="logo" class="logo" src="../icons/48.png" alt="" />
        <div class="head-text">
          <h1>MyBrief</h1>
          <p id="host" class="host"></p>
        </div>
      </header>
      <p id="status" class="status" hidden></p>
      <p id="visio-hint" class="hint" data-i18n="videoCallHint" hidden></p>
      <button id="new-meeting" class="btn btn-brand" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor" />
          <path
            d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span data-i18n="newMeeting"></span>
      </button>
      <button id="open-app" class="btn" type="button">
        <span data-i18n="openApp"></span>
      </button>
      <nav class="links">
        <a id="link-history" href="#" data-i18n="history"></a>
        <a id="link-config" href="#" data-i18n="config"></a>
      </nav>
      <label class="toggle">
        <input id="reminder" type="checkbox" />
        <span data-i18n="reminderLabel"></span>
      </label>
      <footer class="foot">
        <button id="unlink" class="link-btn" type="button" data-i18n="changeSite"></button>
      </footer>
    </section>

    <!-- Pas encore lié : lire l'onglet courant, proposer la liaison -->
    <section id="unlinked" hidden>
      <header class="head">
        <img class="logo" src="../icons/48.png" alt="" />
        <div class="head-text">
          <h1 data-i18n="linkTitle"></h1>
        </div>
      </header>
      <p class="intro" data-i18n="linkIntro"></p>
      <p id="probe" class="status"></p>
      <button id="link" class="btn btn-brand" type="button" hidden></button>
      <p id="error" class="error" hidden></p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
