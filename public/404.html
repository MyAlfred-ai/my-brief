<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — MyBrief</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Lexend', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #FFFEFC;
      color: #1f2937;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(243, 132, 0, 0.18);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(243, 132, 0, 0.1);
      padding: 36px 32px;
      max-width: 420px; width: 100%;
      text-align: center;
    }
    .code {
      font-size: 3rem;
      font-weight: 700;
      color: #F38400;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; color: #111827; }
    p { font-size: .92rem; line-height: 1.5; margin: 0 0 6px; color: #4b5563; }
    .btn {
      display: inline-block; margin-top: 18px; padding: 11px 22px;
      background: #F38400; color: #fff; text-decoration: none;
      border-radius: 8px; font-weight: 600; font-size: .95rem; border: 0; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    @media (prefers-color-scheme: dark) {
      body { background: #14110d; color: #e5e7eb; }
      .card { background: #1e1a15; border-color: rgba(243, 132, 0, 0.25); box-shadow: 0 10px 30px rgba(0,0,0,.4); }
      h1 { color: #f1f5f9; } p { color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>Cette page n'existe pas ou plus.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
